apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-service
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /main
        pathType: Prefix
        backend:
          service:
            name: main-service
            port:
              number: 8080
      - path: /estadisticas
        pathType: Prefix
        backend:
          service:
            name: estadisticas-service
            port:
              number: 8080
      - path: /fastapi
        pathType: Prefix
        backend:
          service:
            name: fastapi-service
            port:
              number: 8000
