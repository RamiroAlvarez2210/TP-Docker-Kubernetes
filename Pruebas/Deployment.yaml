apiVersion: apps/v1
kind: Deployment
metadata:
  name: index-deployment

spec:
  replicas: 4

  selector:
    matchLabels:
      app: index-pod

  template:
    metadata:
      labels:
        app: index-pod

    spec:
      containers:
        - name: index
          image: mi-k8s-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: index-service

spec:
  type: NodePort

  selector:
    app: index-pod

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
