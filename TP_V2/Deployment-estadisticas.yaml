apiVersion: apps/v1
kind: Deployment
metadata:
  name: estadisticas-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: estadisticas-pod
  template:
    metadata:
      labels:
        app: estadisticas-pod
    spec:
      containers:
        - name: estadisticas
          image: ramiroalvarez2210/nginx-estadisticas
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: index-service
spec:
  type: NodePort
  ports:
    - port: 8082
      targetPort: 80
  selector:
    app: estadisticas-pod
